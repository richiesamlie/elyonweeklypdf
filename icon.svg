<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Scholastic Deep Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#244570" />
      <stop offset="50%" stop-color="#1E3A5F" />
      <stop offset="100%" stop-color="#112238" />
    </linearGradient>

    <!-- Subtle Inner Border Highlight -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </linearGradient>

    <!-- Top Paper Sheet Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAF7F2" />
    </linearGradient>

    <!-- Under-sheet Gradient (Stack effect) -->
    <linearGradient id="underPaperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBE6DE" />
      <stop offset="100%" stop-color="#DCD5C9" />
    </linearGradient>

    <!-- Calendar Header Strip -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A5F" />
      <stop offset="100%" stop-color="#2D5584" />
    </linearGradient>

    <!-- Badge Forest Green Gradient -->
    <linearGradient id="greenBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E8245" />
      <stop offset="100%" stop-color="#145A2F" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadowPaper" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0A1320" flood-opacity="0.35" />
    </filter>
    <filter id="shadowBadge" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0A1320" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Squircle (Maskable Safe Zone: inner 80% circle is safe) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Background Decorative Grid Hint -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="192" x2="448" y2="192" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="320" x2="448" y2="320" />
    <line x1="64" y1="384" x2="448" y2="384" />
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="192" y1="64" x2="192" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="320" y1="64" x2="320" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
  </g>

  <!-- Under-sheet (Secondary stacked page rotated 3 degrees) -->
  <g transform="rotate(3 256 262)">
    <rect x="108" y="86" width="296" height="344" rx="20" fill="url(#underPaperGrad)" opacity="0.75" />
  </g>

  <!-- Main Ledger Sheet (White / Warm Paper) with Drop Shadow -->
  <g filter="url(#shadowPaper)">
    <rect x="96" y="80" width="320" height="352" rx="22" fill="url(#paperGrad)" />

    <!-- Calendar / Weekly Ledger Header Bar -->
    <path d="M 96 102 C 96 89.8 105.8 80 118 80 L 394 80 C 406.2 80 416 89.8 416 102 L 416 142 L 96 142 Z" fill="url(#headerGrad)" />

    <!-- Spiral Binder Ring Notches -->
    <rect x="136" y="70" width="16" height="24" rx="8" fill="#FAF7F2" stroke="#CBD5E1" stroke-width="2" />
    <rect x="186" y="70" width="16" height="24" rx="8" fill="#FAF7F2" stroke="#CBD5E1" stroke-width="2" />
    <rect x="236" y="70" width="16" height="24" rx="8" fill="#FAF7F2" stroke="#CBD5E1" stroke-width="2" />
    <rect x="286" y="70" width="16" height="24" rx="8" fill="#FAF7F2" stroke="#CBD5E1" stroke-width="2" />
    <rect x="336" y="70" width="16" height="24" rx="8" fill="#FAF7F2" stroke="#CBD5E1" stroke-width="2" />

    <!-- Calendar Header Label Dots (Mon Tue Wed Thu Fri) -->
    <circle cx="152" cy="118" r="4.5" fill="#FAF7F2" opacity="0.9" />
    <circle cx="204" cy="118" r="4.5" fill="#FAF7F2" opacity="0.9" />
    <circle cx="256" cy="118" r="4.5" fill="#FAF7F2" opacity="0.9" />
    <circle cx="308" cy="118" r="4.5" fill="#FAF7F2" opacity="0.9" />
    <circle cx="360" cy="118" r="4.5" fill="#FAF7F2" opacity="0.9" />

    <!-- Weekly Schedule Rows (Clean editorial bars representing subject lessons) -->
    <!-- Row 1: English / Math -->
    <rect x="126" y="168" width="60" height="14" rx="4" fill="#1E3A5F" opacity="0.85" />
    <rect x="198" y="168" width="170" height="14" rx="4" fill="#E2E8F0" />

    <!-- Row 2: Science / Experiment -->
    <rect x="126" y="200" width="76" height="14" rx="4" fill="#1E3A5F" opacity="0.85" />
    <rect x="214" y="200" width="140" height="14" rx="4" fill="#E2E8F0" />

    <!-- Row 3: Mandarin / Language -->
    <rect x="126" y="232" width="52" height="14" rx="4" fill="#1E3A5F" opacity="0.85" />
    <rect x="190" y="232" width="154" height="14" rx="4" fill="#E2E8F0" />

    <!-- Row 4: Arts / Religion -->
    <rect x="126" y="264" width="68" height="14" rx="4" fill="#1E3A5F" opacity="0.85" />
    <rect x="206" y="264" width="124" height="14" rx="4" fill="#E2E8F0" />

    <!-- Row 5: Homeroom / Note -->
    <rect x="126" y="296" width="84" height="14" rx="4" fill="#1E3A5F" opacity="0.85" />
    <rect x="222" y="296" width="96" height="14" rx="4" fill="#E2E8F0" />

    <!-- Subtle divider line -->
    <line x1="126" y1="334" x2="386" y2="334" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4 3" />

    <!-- Bottom summary row -->
    <rect x="126" y="356" width="120" height="12" rx="4" fill="#CBD5E1" opacity="0.7" />
    <rect x="126" y="378" width="80" height="12" rx="4" fill="#E2E8F0" />
  </g>

  <!-- PDF & Google Classroom Ready Seal / Badge (Bottom Right) -->
  <g filter="url(#shadowBadge)" transform="translate(340, 344)">
    <!-- Seal Base Circle -->
    <circle cx="48" cy="48" r="46" fill="url(#greenBadge)" />
    <circle cx="48" cy="48" r="44" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.35" />

    <!-- Stylized Checkmark -->
    <path d="M 32 48 L 43 59 L 66 36" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Scholastic Bookmark Ribbon Accent (Top Right) -->
  <path d="M 372 80 L 372 136 L 388 124 L 404 136 L 404 80 Z" fill="#D97706" opacity="0.95" />
  <path d="M 372 80 L 372 136 L 388 124 L 404 136 L 404 80 Z" fill="none" stroke="#B45309" stroke-width="1" />
</svg>
