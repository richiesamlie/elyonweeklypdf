<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Elyon Primary Weekly Program Hub</title>

  <!-- PWA Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1E3A5F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WeeklyPDF">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #FAF7F2;
      color: #18181B;
      display: flex;
      flex-direction: column;
    }

    #app-frame {
      flex: 1;
      width: 100%;
      min-height: 0;
      border: none;
      display: block;
    }

    button:focus-visible, a:focus-visible {
      outline: 2px solid #FFFFFF;
      outline-offset: 2px;
    }

    /* Install Banner */
    #install-banner {
      display: none;
      background: #1E3A5F;
      color: #FFFFFF;
      padding: 10px 16px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      text-align: center;
      border-top: 1px solid #152943;
      flex-shrink: 0;
    }
    #install-banner button {
      min-height: 40px;
      background: #FFFFFF;
      color: #1E3A5F;
      border: 1px solid #FFFFFF;
      border-radius: 6px;
      padding: 6px 16px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      margin-left: 10px;
    }
    #install-banner .dismiss {
      background: transparent;
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.45);
      margin-left: 6px;
      padding: 6px 12px;
    }

    /* Direct Open Fallback Bar (for mobile browsers blocking cross-origin GAS iframe auth) */
    #auth-fallback {
      background: #18181B;
      color: #FAF7F2;
      padding: 6px 14px;
      border-top: 1px solid #4A4F55;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      flex-shrink: 0;
    }
    #auth-fallback a {
      color: #BDD6F7;
      text-decoration: underline;
      font-weight: 700;
      min-height: 32px;
      display: inline-flex;
      align-items: center;
    }
    #auth-fallback button {
      min-height: 32px;
      min-width: 32px;
      background: transparent;
      border: 1px solid #767168;
      border-radius: 4px;
      color: #FAF7F2;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 8px;
    }
  </style>
</head>
<body>

  <iframe
    id="app-frame"
    title="Elyon Weekly Program Hub"
    src="https://script.google.com/a/macros/elyon.sch.id/s/AKfycbxE9kS-nbJ8HKkMg81TL166_7V7kHbWK1Ue90p5OJM4Bjpnjy4hIWIuNMKxbLhJEd9Z4A/exec"
    allow="clipboard-write"
    loading="eager"
  ></iframe>

  <div id="auth-fallback">
    <span>Sign-in blocked on mobile?</span>
    <a id="auth-fallback-link" href="https://script.google.com/a/macros/elyon.sch.id/s/AKfycbxE9kS-nbJ8HKkMg81TL166_7V7kHbWK1Ue90p5OJM4Bjpnjy4hIWIuNMKxbLhJEd9Z4A/exec" target="_blank" rel="noopener">Open full page</a>
    <button type="button" id="btn-hide-auth" aria-label="Hide sign-in helper">Hide</button>
  </div>

  <div id="install-banner">
    <span>Install Weekly Program Hub on your device for quick access</span>
    <button type="button" id="btn-install">Install App</button>
    <button type="button" class="dismiss" id="btn-dismiss">Not Now</button>
  </div>

  <script>
    const GAS_EXEC_URL = document.getElementById('app-frame').src;
    const authFallback = document.getElementById('auth-fallback');
    const authFallbackLink = document.getElementById('auth-fallback-link');
    const btnHideAuth = document.getElementById('btn-hide-auth');

    if (authFallbackLink && GAS_EXEC_URL) {
      authFallbackLink.href = GAS_EXEC_URL;
    }

    try {
      if (sessionStorage.getItem('weeklypdf_hide_auth_helper') === '1') {
        authFallback.style.display = 'none';
      }
    } catch (e) {}

    btnHideAuth.addEventListener('click', () => {
      authFallback.style.display = 'none';
      try { sessionStorage.setItem('weeklypdf_hide_auth_helper', '1'); } catch (e) {}
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    let deferredPrompt = null;
    const banner = document.getElementById('install-banner');
    const btnInstall = document.getElementById('btn-install');
    const btnDismiss = document.getElementById('btn-dismiss');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      banner.style.display = 'block';
    });

    btnInstall.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      banner.style.display = 'none';
    });

    btnDismiss.addEventListener('click', () => {
      banner.style.display = 'none';
    });

    window.addEventListener('appinstalled', () => {
      banner.style.display = 'none';
      deferredPrompt = null;
    });
  </script>

</body>
</html>
