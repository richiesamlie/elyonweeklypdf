<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Weekly Program PDF Hub</title>

  <!-- PWA Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4338ca">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WeeklyPDF">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { background: #f8fafc; }

    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Install Banner */
    #install-banner {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #4338ca;
      color: #fff;
      padding: 14px 20px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      z-index: 9999;
      box-shadow: 0 -4px 20px rgba(67, 56, 202, 0.3);
    }
    #install-banner button {
      background: #fff;
      color: #4338ca;
      border: none;
      border-radius: 8px;
      padding: 8px 20px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      margin-left: 12px;
    }
    #install-banner .dismiss {
      background: none;
      color: rgba(255,255,255,0.7);
      margin-left: 8px;
      padding: 8px 12px;
    }
  </style>
</head>
<body>

  <iframe
    id="app-frame"
    src="https://script.google.com/a/macros/elyon.sch.id/s/AKfycbxE9kS-nbJ8HKkMg81TL166_7V7kHbWK1Ue90p5OJM4Bjpnjy4hIWIuNMKxbLhJEd9Z4A/exec"
    allow="clipboard-write"
    loading="eager"
  ></iframe>

  <div id="install-banner">
    📄 Install Weekly Program Hub?
    <button id="btn-install">Install</button>
    <button class="dismiss" id="btn-dismiss">Later</button>
  </div>

  <script>
    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    // Install Prompt
    let deferredPrompt = null;
    const banner = document.getElementById('install-banner');
    const btnInstall = document.getElementById('btn-install');
    const btnDismiss = document.getElementById('btn-dismiss');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      banner.style.display = 'block';
    });

    btnInstall.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      banner.style.display = 'none';
    });

    btnDismiss.addEventListener('click', () => {
      banner.style.display = 'none';
    });

    window.addEventListener('appinstalled', () => {
      banner.style.display = 'none';
      deferredPrompt = null;
    });
  </script>

</body>
</html>
