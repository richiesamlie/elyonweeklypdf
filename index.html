<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Elyon Primary Weekly Program Hub</title>
  <meta name="description" content="Elyon Christian School Primary Weekly Program Hub for editing class schedules, exporting PDFs, and publishing to Google Classroom.">

  <!-- Preconnect to Google Apps Script origins for faster iframe handshake -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">

  <!-- PWA Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1E3A5F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WeeklyPDF">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    /* Hallmark · shape: app screen · genre: editorial · theme: brand · redesign: restyle
     * paper: oklch(97.6% 0.008 80) · accent: oklch(34.5% 0.078 252) · display: Instrument Serif · body: Plus Jakarta Sans
     * nav: top iframe shell, kept · signature: direct Apps Script workspace frame, kept · states: default, hover, focus-visible, active, disabled
     * axes: light/roman-serif/cool · posture: restrained · contrast: pass · v2.0.0 */
    /* Hallmark · pre-emit critique: P4 H4 E5 S4 R5 V4 · weakest: H, fallback and install bars competed at the bottom edge; unified token hierarchy and spacing */
    :root {
      --bg: #FAF7F2;
      --surface: #FFFDF9;
      --surface-dark: #18181B;
      --text: #18181B;
      --text-on-dark: #FAF7F2;
      --border-dark: #4A4F55;
      --border-muted: #767168;
      --primary: #1E3A5F;
      --primary-border: #152943;
      --link-on-dark: #BDD6F7;
      --dismiss-border: rgba(250, 247, 242, 0.45);
      --font-body: system-ui, -apple-system, sans-serif;
      --space-3xs: 2px;
      --space-2xs: 4px;
      --space-xs: 8px;
      --space-sm: 12px;
      --space-md: 16px;
      --radius-sm: 4px;
      --radius-md: 6px;
      --dur-micro: 120ms;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      scrollbar-color: var(--border-muted) var(--bg);
    }
    html, body {
      height: 100%;
      overflow-x: clip;
      overflow-y: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      caret-color: var(--primary);
      display: flex;
      flex-direction: column;
    }

    ::selection {
      background: var(--link-on-dark);
      color: var(--text);
    }

    #app-frame {
      flex: 1;
      width: 100%;
      min-height: 0;
      border: none;
      display: block;
    }

    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--surface);
      outline-offset: 2px;
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Install Banner */
    #install-banner {
      display: none;
      background: var(--primary);
      color: var(--surface);
      padding: var(--space-xs) var(--space-md);
      font-family: var(--font-body);
      font-size: 13.5px;
      font-weight: 600;
      text-align: center;
      border-top: 1px solid var(--primary-border);
      flex-shrink: 0;
    }
    #install-banner button {
      min-height: 40px;
      background: var(--surface);
      color: var(--primary);
      border: 1px solid var(--surface);
      border-radius: var(--radius-md);
      padding: var(--space-xs) var(--space-md);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      margin-left: var(--space-xs);
      transition: transform var(--dur-micro) var(--ease-out), opacity var(--dur-micro) var(--ease-out);
    }
    #install-banner .dismiss {
      background: transparent;
      color: var(--surface);
      border: 1px solid var(--dismiss-border);
      margin-left: var(--space-xs);
      padding: var(--space-xs) var(--space-sm);
    }

    /* Direct Open Fallback Bar (for mobile browsers blocking cross-origin GAS iframe auth) */
    #auth-fallback {
      background: var(--surface-dark);
      color: var(--text-on-dark);
      padding: var(--space-xs) var(--space-md);
      border-top: 1px solid var(--border-dark);
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: var(--space-xs);
      flex-shrink: 0;
    }
    #auth-fallback a {
      color: var(--link-on-dark);
      text-decoration: underline;
      font-weight: 700;
      min-height: 32px;
      display: inline-flex;
      align-items: center;
    }
    #auth-fallback button {
      min-height: 32px;
      min-width: 32px;
      background: transparent;
      border: 1px solid var(--border-muted);
      border-radius: var(--radius-sm);
      color: var(--text-on-dark);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      padding: var(--space-3xs) var(--space-xs);
      transition: transform var(--dur-micro) var(--ease-out), opacity var(--dur-micro) var(--ease-out);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <iframe
    id="app-frame"
    title="Elyon Weekly Program Hub"
    src="https://script.google.com/a/macros/elyon.sch.id/s/AKfycbxE9kS-nbJ8HKkMg81TL166_7V7kHbWK1Ue90p5OJM4Bjpnjy4hIWIuNMKxbLhJEd9Z4A/exec"
    allow="clipboard-write"
    loading="eager"
  ></iframe>

  <div id="auth-fallback">
    <span>Sign-in blocked on mobile?</span>
    <a id="auth-fallback-link" href="https://script.google.com/a/macros/elyon.sch.id/s/AKfycbxE9kS-nbJ8HKkMg81TL166_7V7kHbWK1Ue90p5OJM4Bjpnjy4hIWIuNMKxbLhJEd9Z4A/exec" target="_blank" rel="noopener">Open full page</a>
    <button type="button" id="btn-hide-auth" aria-label="Hide sign-in helper">Hide</button>
  </div>

  <div id="install-banner">
    <span>Install Weekly Program Hub on your device for quick access</span>
    <button type="button" id="btn-install">Install App</button>
    <button type="button" class="dismiss" id="btn-dismiss">Not Now</button>
  </div>

  <script>
    const GAS_EXEC_URL = document.getElementById('app-frame').src;
    const authFallback = document.getElementById('auth-fallback');
    const authFallbackLink = document.getElementById('auth-fallback-link');
    const btnHideAuth = document.getElementById('btn-hide-auth');

    if (authFallbackLink && GAS_EXEC_URL) {
      authFallbackLink.href = GAS_EXEC_URL;
    }

    try {
      if (sessionStorage.getItem('weeklypdf_hide_auth_helper') === '1') {
        authFallback.style.display = 'none';
      }
    } catch (e) {}

    btnHideAuth.addEventListener('click', () => {
      authFallback.style.display = 'none';
      try { sessionStorage.setItem('weeklypdf_hide_auth_helper', '1'); } catch (e) {}
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    let deferredPrompt = null;
    const banner = document.getElementById('install-banner');
    const btnInstall = document.getElementById('btn-install');
    const btnDismiss = document.getElementById('btn-dismiss');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      banner.style.display = 'block';
    });

    btnInstall.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      banner.style.display = 'none';
    });

    btnDismiss.addEventListener('click', () => {
      banner.style.display = 'none';
    });

    window.addEventListener('appinstalled', () => {
      banner.style.display = 'none';
      deferredPrompt = null;
    });
  </script>

</body>
</html>
